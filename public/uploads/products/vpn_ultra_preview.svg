<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="vpnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="380" fill="url(#vpnGrad)"/>
  <circle cx="300" cy="190" r="160" fill="url(#glow)"/>
  
  <g transform="translate(80, 50)">
    <!-- Credit-Card style VIP License Card -->
    <rect x="0" y="0" width="440" height="270" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.6))"/>
    
    <!-- Chip -->
    <rect x="40" y="40" width="55" height="42" rx="6" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <line x1="40" y1="61" x2="95" y2="61" stroke="#b45309" stroke-width="1"/>
    <line x1="68" y1="40" x2="68" y2="82" stroke="#b45309" stroke-width="1"/>
    
    <!-- Title -->
    <text x="390" y="55" font-family="'Oswald', sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="end">VPN ULTRA</text>
    <text x="390" y="75" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c084fc" text-anchor="end">1-YEAR DEDICATED PASS</text>
    
    <!-- Serial placeholder -->
    <text x="40" y="160" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold" fill="#ffffff" letter-spacing="3">VPNU-••••-••••-2026</text>
    
    <!-- Bottom Meta -->
    <text x="40" y="225" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">PROTOCOL</text>
    <text x="40" y="242" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">WireGuard &amp; OpenVPN</text>
    
    <text x="390" y="225" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="end">VALIDITY</text>
    <text x="390" y="242" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#4ade80" text-anchor="end">365 DAYS ACTIVE</text>
  </g>
</svg>
